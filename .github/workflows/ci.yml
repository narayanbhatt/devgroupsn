name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile app (lint, typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  database:
    name: Database (migrations and access rules)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devtest
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: ./supabase/tests/run.sh
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devtest

  android-apk:
    name: Android test APK
    needs: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Caches Gradle and its plugins between runs: faster builds and fewer
      # downloads from the Gradle plugin portal (a failed download broke one build).
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build APK
        # Test build only: signed with the debug key. Play releases use the upload key (Phase 6).
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
        # Public client values only (the anon key is designed to ship inside the app;
        # row-level security protects the data). Repo variables override them.
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://cprqpquftrqvohbfngvf.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNwcnFwcXVmdHJxdm9oYmZuZ3ZmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5OTc5MzMsImV4cCI6MjExMDU3MzkzM30.nW6CZPZOjPZawB2DiLW2Z7eOgIpMFThjIT2mJ32cacY' }}
      - uses: actions/upload-artifact@v4
        with:
          name: devgroup-test-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
